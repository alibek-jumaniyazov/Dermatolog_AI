# Bootstrap only AFTER DNS points at the target server. Does not enable the app.
server {
  listen 80;
  listen [::]:80;
  server_name dermatologai.uz;
  server_tokens off;
  access_log off;
  location ^~ /.well-known/acme-challenge/ { root /var/lib/letsencrypt; try_files $uri =404; }
  location / { add_header X-Robots-Tag 'noindex, nofollow' always; return 503; }
}
