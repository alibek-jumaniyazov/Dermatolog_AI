# Install /etc/logrotate.d/dermatologai-nginx only if distro wildcard config does not
# already own /var/log/nginx/*.log. Do not configure the same file twice.
/var/log/nginx/dermatologai-error.log {
    daily
    rotate 7
    maxsize 10M
    missingok
    notifempty
    compress
    delaycompress
    sharedscripts
    postrotate
        /usr/sbin/nginx -s reopen
    endscript
}
