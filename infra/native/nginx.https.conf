# Future-server template; install only after a real certificate exists.
server {
  listen 80;
  listen [::]:80;
  server_name dermatologai.uz;
  access_log off;
  location ^~ /.well-known/acme-challenge/ { root /var/lib/letsencrypt; try_files $uri =404; }
  location / { return 308 https://dermatologai.uz$request_uri; }
}
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name dermatologai.uz;
  ssl_certificate /etc/letsencrypt/live/dermatologai.uz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/dermatologai.uz/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:DERMATOLOG_TLS:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  server_tokens off;
  root /opt/dermatologai/current/apps/web/dist;
  client_max_body_size 31m;
  client_body_timeout 30s;
  # No URL access logs: reset tokens and medical resource IDs are sensitive.
  access_log off;
  error_log /var/log/nginx/dermatologai-error.log crit;
  include /etc/nginx/snippets/dermatologai-security.conf;
  add_header Cache-Control no-cache;
  # Controlled maintenance marker; public requests stop before backups/migrations.
  if (-f /var/lib/dermatologai/maintenance) { return 503; }
  location /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    add_header X-Robots-Tag 'noindex, nofollow, noarchive' always;
    add_header Cache-Control no-store always;
    include /etc/nginx/snippets/dermatologai-security.conf;
  }
  location = / { try_files /index.html =404; }
  location = /privacy { try_files /privacy/index.html =404; }
  location = /consent { try_files /consent/index.html =404; }
  location = /limitations { try_files /limitations/index.html =404; }
  location ~ ^/(privacy|consent|limitations)/$ { return 308 /$1; }
  location ~ ^/(app|admin)(/|$) { try_files /app-shell.html =404; include /etc/nginx/snippets/dermatologai-security.conf; add_header X-Robots-Tag 'noindex, nofollow, noarchive' always; add_header Cache-Control no-store always; }
  location ~ ^/(login|register|forgot-password|reset-password)/?$ { try_files /app-shell.html =404; include /etc/nginx/snippets/dermatologai-security.conf; add_header X-Robots-Tag 'noindex, nofollow, noarchive' always; add_header Cache-Control no-store always; }
  location = /app-shell.html { include /etc/nginx/snippets/dermatologai-security.conf; add_header X-Robots-Tag 'noindex, nofollow, noarchive' always; add_header Cache-Control no-store always; }
  location = /sw.js { include /etc/nginx/snippets/dermatologai-security.conf; add_header Cache-Control no-cache; }
  location /assets/ { try_files $uri =404; include /etc/nginx/snippets/dermatologai-security.conf; add_header Cache-Control 'public, max-age=31536000, immutable'; }
  location = /offline.html { include /etc/nginx/snippets/dermatologai-security.conf; add_header X-Robots-Tag 'noindex, nofollow' always; add_header Cache-Control no-cache; }
  location ~ ^/(robots\.txt|sitemap\.xml|og-image\.png|manifest\.webmanifest|icon\.svg)$ { try_files $uri =404; }
  location = /404.html { internal; include /etc/nginx/snippets/dermatologai-security.conf; add_header X-Robots-Tag 'noindex, nofollow' always; }
  error_page 404 /404.html;
  location / { return 404; }
}
