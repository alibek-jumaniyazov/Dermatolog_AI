name: raqamli-dermatolog
x-api-env: &api-env
  NODE_ENV: ${COMPOSE_NODE_ENV:-development}
  APP_ORIGIN: ${COMPOSE_APP_ORIGIN:-http://localhost:8080}
  HOST: 0.0.0.0
  PORT: 3001
  DATABASE_URL: postgresql://derma:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/dermatolog
  JWT_SECRET: ${JWT_SECRET:?Run setup:local}
  REFRESH_SECRET: ${REFRESH_SECRET:?Run setup:local}
  ML_SERVICE_URL: http://ml:8001
  ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:?Run setup:local}
  AI_PROVIDER: ${AI_PROVIDER:-local}
  REDIS_URL: redis://redis:6379
  STORAGE_DRIVER: s3
  S3_ENDPOINT: http://storage:9000
  S3_REGION: us-east-1
  S3_BUCKET: dermatolog-private
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
  SMTP_HOST: mailpit
  SMTP_PORT: 1025
  SMTP_FROM: noreply@localhost
  TEMP_RETENTION_MINUTES: 60
services:
  postgres:
    image: postgres:17.5-bookworm
    environment:
      POSTGRES_USER: derma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: dermatolog
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U derma -d dermatolog"], interval: 5s, timeout: 3s, retries: 15}
    restart: unless-stopped
  redis:
    image: redis:7.4.5-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis:/data]
    healthcheck: {test: [CMD, redis-cli, ping], interval: 5s, timeout: 3s, retries: 15}
    restart: unless-stopped
  storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
    volumes: [objects:/data]
    restart: unless-stopped
  storage-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [storage]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    entrypoint: [/bin/sh, -c]
    command:
      - |
        set -eu
        attempt=0
        until mc alias set local http://storage:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}"; do
          attempt=$$((attempt + 1))
          if [ "$$attempt" -ge 60 ]; then exit 1; fi
          sleep 2
        done
        mc mb --ignore-existing local/dermatolog-private
        mc anonymous set none local/dermatolog-private
  migrate:
    build: {context: ., dockerfile: infra/docker/api.Dockerfile}
    environment: *api-env
    command: [node, apps/api/node_modules/prisma/build/index.js, migrate, deploy, --schema=apps/api/prisma/schema.prisma]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build: {context: ., dockerfile: infra/docker/api.Dockerfile}
    environment:
      <<: *api-env
      RUN_WORKER_IN_API: 'false'
    depends_on:
      migrate: {condition: service_completed_successfully}
      storage-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      ml: {condition: service_healthy}
    healthcheck: {test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/api/v1/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 10s, timeout: 5s, retries: 10}
    restart: unless-stopped
  worker:
    build: {context: ., dockerfile: infra/docker/api.Dockerfile}
    environment:
      <<: *api-env
      WORKER_ONLY: 'true'
      RUN_WORKER_IN_API: 'false'
    command: [node, apps/api/dist/worker.js]
    depends_on:
      migrate: {condition: service_completed_successfully}
      storage-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      ml: {condition: service_healthy}
    restart: unless-stopped
  ml:
    build: {context: ., dockerfile: services/ml/Dockerfile}
    environment:
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN}
      AI_PROVIDER: ${AI_PROVIDER:-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ML_MODEL_MANIFEST: /workspace/ml/artifacts/manifest.json
      ML_TRUSTED_ARTIFACT_SHA256: ${ML_TRUSTED_ARTIFACT_SHA256:-}
    volumes: [./ml/artifacts:/workspace/ml/artifacts:ro]
    healthcheck: {test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=3)"], interval: 10s, timeout: 5s, retries: 10, start_period: 15s}
    restart: unless-stopped
  web:
    build: {context: ., dockerfile: infra/docker/web.Dockerfile}
    ports: ['127.0.0.1:8080:80']
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.31.2
    ports: ['127.0.0.1:18025:8025']
volumes:
  postgres:
  redis:
  objects:
